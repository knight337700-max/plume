components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: plume_session
      description: OIDC 로그인 후 발급되는 Secure HttpOnly Session Cookie
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 향후 서비스 통합용
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: 동일 Command 중복 실행 방지
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^W/\"revision-[0-9]+\"$
      description: 낙관적 잠금 Revision ETag
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
      description: SSE 재연결 기준 Event ID
  responses:
    BadRequest:
      description: Invalid request
      content: &id001
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
      content: *id001
    Forbidden:
      description: Permission denied
      content: *id001
    NotFound:
      description: Resource not found or outside tenant
      content: *id001
    Conflict:
      description: State or idempotency conflict
      content: *id001
    PreconditionFailed:
      description: ETag revision mismatch
      content: *id001
    UnprocessableEntity:
      description: Domain policy violation
      content: *id001
    TooManyRequests:
      description: Rate limit exceeded
