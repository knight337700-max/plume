name: Plume CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mvp-build

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @plume/ui build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Start test infrastructure
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 60

      - name: Prepare test database
        run: pnpm db:migrate:test

      - name: Test
        run: pnpm test

      - name: Gate I Phase 2.5C-B.5/B.6 durable evidence integration
        env:
          DATABASE_URL: postgresql://plume:plume_local_only@localhost:5432/plume
          TEST_DATABASE_URL: postgresql://plume:plume_local_only@localhost:5432/plume_test
          RUN_GATE_I_B5_POSTGRES_TEST: "true"
          RUN_GATE_I_B6_POSTGRES_TEST: "true"
          RUN_LIVE_SMOKE_EVIDENCE_EXPORT_DB_TEST: "true"
        run: pnpm exec vitest run --workspace vitest.workspace.ts packages/infrastructure/src/async/live-smoke-terminal-flow.integration.test.ts packages/infrastructure/src/async/live-smoke-jsonb-array-binding.integration.test.ts packages/infrastructure/src/async/live-smoke-evidence-exporter.integration.test.ts

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down
