name: Publish Plume images to GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish alongside the immutable commit tag
        required: false
        default: mvp

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plume-web
            dockerfile: infra/docker/web.Dockerfile
          - image: plume-api
            dockerfile: infra/docker/api.Dockerfile
          - image: plume-worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: plume-scheduler
            dockerfile: infra/docker/scheduler.Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag || 'mvp' }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
