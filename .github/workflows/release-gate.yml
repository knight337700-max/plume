name: Plume MVP release gate

on:
  pull_request:
    branches: [main, codex/mvp-build]
  workflow_dispatch:
  push:
    tags:
      - mvp-candidate-*

permissions:
  contents: read

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.17.0

jobs:
  contracts-static:
    name: Contracts and Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build UI package
        run: pnpm --filter @plume/ui build
      - name: Contract drift
        run: pnpm contracts:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit-integration:
    name: Unit and Integration
    needs: contracts-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build UI package
        run: pnpm --filter @plume/ui build
      - name: Start test infrastructure
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 60
      - name: Database migration
        run: pnpm db:migrate:test
      - name: Unit and regression tests
        run: pnpm test
      - name: Integration workflow
        run: pnpm test:integration --filter core-workflow
      - name: Delivery package
        run: pnpm test:delivery
      - name: SSE
        run: pnpm test:sse
      - name: Stop test infrastructure
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  jacomo-api-e2e:
    name: Jacomo API E2E
    needs: unit-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start test infrastructure
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 60
      - name: Apply test migration
        run: pnpm db:migrate:test
      - name: Run deterministic Jacomo API flow
        run: pnpm e2e:api:jacomo
      - name: Stop test infrastructure
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  jacomo-browser-e2e:
    name: Jacomo Browser E2E
    needs: jacomo-api-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build UI package
        run: pnpm --filter @plume/ui build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run 1440px Jacomo browser flow
        run: pnpm e2e:web:jacomo

  visual:
    name: Visual Regression
    needs: jacomo-browser-e2e
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build UI package
        run: pnpm --filter @plume/ui build
      - name: Run approved snapshots without update
        run: pnpm e2e:visual
      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/plume-gate-g-results/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 7

  accessibility:
    name: Accessibility
    needs: jacomo-browser-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build UI package
        run: pnpm --filter @plume/ui build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run axe and keyboard checks
        run: pnpm e2e:a11y

  integrity:
    name: Integrity
    needs: contracts-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Architecture and contract integrity
        run: pnpm integrity
      - name: Staging manifest integrity
        run: pnpm deployment:check

  docker:
    name: Production Docker images
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plume-web:mvp
            dockerfile: infra/docker/web.Dockerfile
          - image: plume-api:mvp
            dockerfile: infra/docker/api.Dockerfile
          - image: plume-worker:mvp
            dockerfile: infra/docker/worker.Dockerfile
          - image: plume-scheduler:mvp
            dockerfile: infra/docker/scheduler.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

  staging-e2e:
    name: Staging E2E smoke
    needs: [jacomo-api-e2e, docker, integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate staging service contract
        run: pnpm deployment:check
      - name: Start staging-like infrastructure
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 60
      - name: Apply staging smoke migration
        run: pnpm db:migrate:test
      - name: Run deterministic staging smoke
        run: pnpm e2e:api:jacomo
      - name: Stop staging-like infrastructure
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  manual-approval:
    name: Manual approval after staging
    needs: staging-e2e
    runs-on: ubuntu-latest
    environment:
      name: plume-staging-approval
    steps:
      - name: Approval gate reached
        run: echo "Staging E2E passed; protected environment approval is required."

  release-candidate:
    name: Release candidate readiness
    needs:
      [
        contracts-static,
        unit-integration,
        jacomo-api-e2e,
        jacomo-browser-e2e,
        visual,
        accessibility,
        integrity,
        docker,
        staging-e2e,
        manual-approval,
      ]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/mvp-build' || startsWith(github.ref, 'refs/tags/mvp-candidate-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start release-gate test infrastructure
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait --wait-timeout 60
      - name: Apply release-gate test migration
        run: pnpm db:migrate:test
      - name: Run complete local release gate
        run: pnpm release:check
      - name: Stop release-gate test infrastructure
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down
