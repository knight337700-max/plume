apiVersion: plume.dev/v1
kind: StagingSecretContract
metadata:
  name: plume-staging-runtime
  environment: staging
  contractVersion: 1.0.0

# Values are deliberately references/placeholders. Provision them in the
# platform secret manager; this file must never be copied into a live Secret.
secretStore:
  provider: managed-secret-store
  path: "secret-manager://plume-staging/runtime"
  rotation: provider-managed

secrets:
  DATABASE_URL:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/DATABASE_URL>"
  REDIS_URL:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/REDIS_URL>"
  S3_ENDPOINT:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/S3_ENDPOINT>"
  S3_ACCESS_KEY_ID:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/S3_ACCESS_KEY_ID>"
  S3_SECRET_ACCESS_KEY:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/S3_SECRET_ACCESS_KEY>"
  S3_BUCKET:
    requiredBy: [api, worker, scheduler]
    placeholder: "<secret-manager://plume-staging/runtime/S3_BUCKET>"
  SESSION_SECRET:
    requiredBy: [api]
    placeholder: "<secret-manager://plume-staging/runtime/SESSION_SECRET>"
  OPENAI_API_KEY:
    requiredBy: [worker]
    optionalForLocalMvp: true
    placeholder: "<secret-manager://plume-staging/runtime/OPENAI_API_KEY>"

browserExposure:
  forbidden: [DATABASE_URL, REDIS_URL, S3_SECRET_ACCESS_KEY, SESSION_SECRET, OPENAI_API_KEY]
  publicConfigOnly: [PLUME_API_ORIGIN]
