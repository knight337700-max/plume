apiVersion: plume.dev/v1
kind: StagingServiceContract
metadata:
  name: plume-staging
  environment: staging
  contractVersion: 1.0.0
  description: Platform-neutral service contract for the Plume MVP candidate.

# This is an interface contract, not a Kubernetes manifest. A platform adapter
# supplies managed services, ingress, and the secret provider. Images below are
# pinned to the Phase 1 GHCR digests; changing one is an intentional release
# operation.
environment:
  NODE_ENV: production
  APP_ENV: staging
  QUEUE_PREFIX: plume-staging
  OPENAI_PROVIDER_MODE: mock
  OPENAI_MODEL: gpt-5.6-luna

images:
  web:
    repository: "ghcr.io/knight337700-max/plume-web"
    digest: "sha256:67fe7192f4897f0f50efb08d26b0e2ed13ca187a12824201b8d7e788c62a1304"
    ref: "ghcr.io/knight337700-max/plume-web@sha256:67fe7192f4897f0f50efb08d26b0e2ed13ca187a12824201b8d7e788c62a1304"
  api:
    repository: "ghcr.io/knight337700-max/plume-api"
    digest: "sha256:d1fe891395db9810796c8962ce951e232da9aecf96fea9a15c461f4438d1f47f"
    ref: "ghcr.io/knight337700-max/plume-api@sha256:d1fe891395db9810796c8962ce951e232da9aecf96fea9a15c461f4438d1f47f"
  worker:
    repository: "ghcr.io/knight337700-max/plume-worker"
    digest: "sha256:ce5a2e17ac10a16ff4f4063fe12731f0c7b6cf71b6293c510fa5a024dc1a64ef"
    ref: "ghcr.io/knight337700-max/plume-worker@sha256:ce5a2e17ac10a16ff4f4063fe12731f0c7b6cf71b6293c510fa5a024dc1a64ef"
  scheduler:
    repository: "ghcr.io/knight337700-max/plume-scheduler"
    digest: "sha256:bac79f720e0911ca1c4df4275cf9c99cc4a6f95a2be8f1e8da00b79d82a9bb90"
    ref: "ghcr.io/knight337700-max/plume-scheduler@sha256:bac79f720e0911ca1c4df4275cf9c99cc4a6f95a2be8f1e8da00b79d82a9bb90"

network:
  public:
    visibility: public
    services: [web, api]
    ingress:
      web:
        port: 8080
        tls: required
      api:
        port: 3000
        tls: required
  private:
    visibility: private
    name: plume-staging-private
    services: [api, worker, scheduler, postgres, redis, object-storage]
    denyDirectInternetIngress: true

services:
  web:
    role: browser-ui
    image: web
    networks: [public]
    publicEntry: true
    ports:
      http: 8080
    scaling:
      mode: horizontal
      minReplicas: 1
      maxReplicas: 4
      independentScaleKey: web
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    health:
      liveness: { type: http, path: /, port: 8080 }
      readiness: { type: http, path: /, port: 8080 }
    shutdown:
      signal: SIGTERM
      gracePeriodSeconds: 30
    config:
      API_ORIGIN: { fromConfig: PLUME_API_ORIGIN }
    forbiddenSecretInjection: [OPENAI_API_KEY, DATABASE_URL, REDIS_URL, S3_SECRET_ACCESS_KEY]

  api:
    role: http-api
    image: api
    networks: [public, private]
    publicEntry: true
    ports:
      http: 3000
    scaling:
      mode: horizontal
      minReplicas: 1
      maxReplicas: 8
      independentScaleKey: api
      independentFrom: [worker]
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    health:
      liveness: { type: http, path: /api/v1/health/live, port: 3000 }
      readiness: { type: http, path: /api/v1/health/ready, port: 3000 }
    shutdown:
      signal: SIGTERM
      gracePeriodSeconds: 45
      drainSseConnections: true
    secretRefs:
      - name: plume-staging-runtime
        keys:
          [
            DATABASE_URL,
            REDIS_URL,
            S3_ENDPOINT,
            S3_ACCESS_KEY_ID,
            S3_SECRET_ACCESS_KEY,
            S3_BUCKET,
            SESSION_SECRET,
          ]
    config:
      NODE_ENV: production
      APP_ENV: staging
      CORS_ORIGINS: "https://<staging-web-host>"
      CORS_ALLOWED_ORIGINS: "https://<staging-web-host>"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      QUEUE_PREFIX: plume-staging
      OPENAI_PROVIDER_MODE: mock
      OPENAI_MODEL: gpt-5.6-luna

  worker:
    role: async-job-consumer
    image: worker
    networks: [private]
    publicEntry: false
    scaling:
      mode: horizontal
      minReplicas: 1
      maxReplicas: 12
      independentScaleKey: worker
      independentFrom: [api]
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 2000m, memory: 2Gi }
    health:
      liveness: { type: process, entrypoint: worker-main }
      readiness: { type: queue-consumer, queues: [ai-standard, render, validation, export] }
    shutdown:
      signal: SIGTERM
      gracePeriodSeconds: 120
      stopAcceptingJobs: true
      finishOrReleaseLeases: true
    secretRefs:
      - name: plume-staging-runtime
        keys:
          [DATABASE_URL, REDIS_URL, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET]
    config:
      NODE_ENV: production
      APP_ENV: staging
      QUEUE_PREFIX: plume-staging
      OPENAI_PROVIDER_MODE: mock
      OPENAI_MODEL: gpt-5.6-luna

  scheduler:
    role: scheduled-maintenance
    image: scheduler
    networks: [private]
    publicEntry: false
    scaling:
      mode: singleton
      minReplicas: 1
      maxReplicas: 1
      policy: lease_singleton
      leaseName: plume-staging:scheduler:lease
      leaseTtlSeconds: 90
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    health:
      liveness: { type: process, entrypoint: scheduler-main }
      readiness: { type: lease, leaseName: plume-staging:scheduler:lease }
    shutdown:
      signal: SIGTERM
      gracePeriodSeconds: 60
      releaseLeaseBeforeExit: true
    secretRefs:
      - name: plume-staging-runtime
        keys:
          [DATABASE_URL, REDIS_URL, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET]
    config:
      NODE_ENV: production
      APP_ENV: staging
      QUEUE_PREFIX: plume-staging
      OPENAI_PROVIDER_MODE: mock

  postgres:
    role: primary-database
    interface: postgresql
    serviceType: managed-or-persistent
    networks: [private]
    publicEntry: false
    port: 5432
    resources:
      capacityClass: managed-postgresql-staging
    persistence:
      required: true
      backupClass: daily-encrypted
      retention: 35d
    health:
      readiness: { type: tcp, port: 5432 }

  redis:
    role: cache-and-queue-backplane
    interface: redis
    serviceType: managed-or-persistent
    networks: [private]
    publicEntry: false
    port: 6379
    resources:
      capacityClass: managed-redis-staging
    persistence:
      required: true
      backupClass: provider-managed
      retention: 7d
    health:
      readiness: { type: redis-ping, port: 6379 }

  object-storage:
    role: asset-and-export-storage
    interface: s3-compatible
    serviceType: managed-or-persistent
    networks: [private]
    publicEntry: false
    port: 443
    resources:
      capacityClass: managed-object-storage-staging
    persistence:
      required: true
      backupClass: versioned-encrypted
      retention: 90d
    signedUrls:
      enabled: true
      host: "https://<staging-storage-host>"
      maxTtlSeconds: 900
    health:
      readiness: { type: object-storage, bucketRef: S3_BUCKET }

queue:
  interface: redis-compatible
  backingService: redis
  prefix: plume-staging
  delivery: at-least-once
  consumerIdempotency: required
  leaseSeconds: 120
  topics:
    [
      default,
      document-analysis,
      asset-processing,
      ai-high,
      ai-standard,
      render,
      validation,
      export,
      notifications,
      maintenance,
      dead-letter,
    ]

database:
  interface: postgresql
  backingService: postgres
  migration:
    owner: release-job
    command: pnpm db:migrate:staging
    target: staging-database
    beforeTraffic: true
    rollback: restore-backup-and-forward-fix

secrets:
  provider: managed-secret-store
  environment: staging
  references:
    runtime: plume-staging-runtime
  requiredKeys:
    [
      DATABASE_URL,
      REDIS_URL,
      S3_ENDPOINT,
      S3_ACCESS_KEY_ID,
      S3_SECRET_ACCESS_KEY,
      S3_BUCKET,
      SESSION_SECRET,
    ]
  optionalKeys: [OPENAI_API_KEY]
  browserExposure: forbidden

observability:
  logs:
    format: json
    requiredFields: [timestamp, level, service, event, traceId, correlationId]
    redact:
      [authorization, cookie, set-cookie, database-url, storage-secret, openai-key, presigned-url]
  tracing:
    propagation: [traceparent, tracestate]
    exporter: otlp-http
    endpoint: "https://<staging-otlp-host>"
  metrics:
    endpoint: /metrics
    scrapeServices: [api, worker, scheduler]
    alerts:
      [
        api-5xx,
        queue-oldest-age,
        worker-crash-loop,
        export-failure-rate,
        database-capacity,
        dead-letter,
      ]

operations:
  deployment:
    strategy: rolling
    maxUnavailable: 0
    maxSurge: 1
    workerJobSafety: drain-or-release-lease-before-termination
    apiSseSafety: keep-old-api-until-connection-drain
  backups:
    postgres: { frequency: daily, retention: 35d, restoreDrill: monthly }
    objectStorage: { versioning: required, retention: 90d }
    redis:
      {
        frequency: daily,
        retention: 7d,
        note: queue data is replayable but persistence is required for recovery,
      }
  rollback:
    application: redeploy-previous-image-tag
    database: restore-backup-then-forward-fix
    worker: pause-consumers-before-schema-rollback
  smokeChecks:
    [
      web-tls,
      api-health,
      database-readiness,
      redis-readiness,
      storage-readiness,
      queue-consumer,
      sse-reconnect,
      signed-url-access,
    ]
